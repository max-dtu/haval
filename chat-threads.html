<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Talk to Models</title>
        <style>
            /* hide radios */
            input[type="radio"] {
                display: none;
            }

            /* hide all panels */
            .panel {
                display: none;
            }

            /* show exactly one panel */
            #tab-webllm:checked ~ .panels .panel:nth-child(1) {
                display: block;
            }

            #tab-ollama:checked ~ .panels .panel:nth-child(2) {
                display: block;
            }

            #tab-remote:checked ~ .panels .panel:nth-child(3) {
                display: block;
            }

            /* optional: style active tab */
            #tab-webllm:checked ~ [role="tablist"] label[for="tab-webllm"],
            #tab-ollama:checked ~ [role="tablist"] label[for="tab-ollama"],
            #tab-remote:checked ~ [role="tablist"] label[for="tab-remote"] {
                border-bottom: 2px solid black;
            }

            [role="tablist"] {
                display: flex;
                gap: 20px;
            }
        </style>
    </head>

    <body>
        <aside class="sidebar sidebar--threads" data-state="open">
            <header class="sidebar--threads__header">
                <h2 class="sidebar--threads__title">Threads</h2>

                <button
                    type="button"
                    aria-label="Start new chat"
                    data-action="new-thread"
                >
                    +
                </button>

                <form role="search" data-action="search-threads">
                    <label for="thread-search-input">Search threads</label>
                    <input
                        id="thread-search-input"
                        type="search"
                        data-action="search-threads"
                    />
                </form>
            </header>

            <nav class="sidebar--threads__nav" aria-label="Thread list">
                <ul class="thread-list">
                    <!-- thread items go here -->
                    <!-- example:
                    <li class="thread-list__item" data-thread-id="123"></li>
                    -->
                </ul>
            </nav>
        </aside>

        <main class="main">
            <h1 class="main__title">
                From the sidebar, click + or select a previous chat
            </h1>
        </main>

        <form class="model-picker">
            <fieldset>
                <legend>Choose model source</legend>

                <!-- radios (state) -->
                <input type="radio" name="model" id="tab-webllm" checked />
                <input type="radio" name="model" id="tab-ollama" />
                <input type="radio" name="model" id="tab-remote" />

                <!-- tab labels -->
                <div role="tablist" aria-label="Model source">
                    <label for="tab-webllm" role="tab">WebLLM</label>
                    <label for="tab-ollama" role="tab">Ollama</label>
                    <label for="tab-remote" role="tab">Remote</label>
                </div>

                <!-- panels -->
                <div class="panels">
                    <div class="panel" role="tabpanel">
                        <h2>WebLLM</h2>
                        <p>WebLLM section</p>
                    </div>

                    <div class="panel" role="tabpanel">
                        <h2>Ollama</h2>
                        <p>Ollama section</p>
                    </div>

                    <div class="panel" role="tabpanel">
                        <h2>Remote</h2>
                        <p>Remote section</p>
                    </div>
                </div>
            </fieldset>
        </form>
    </body>
</html>
