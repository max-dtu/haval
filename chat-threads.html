<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Talk to Models</title>
        <script src="onModelSelectSubmit.js" defer></script>
        <style>
            .model-picker {
                max-width: 600px;
                margin: 0 auto;
                font-family: sans-serif;
            }

            .model-picker__fieldset {
                border: 1px solid #ddd;
                padding: 1rem;
            }

            .model-picker__legend {
                font-weight: bold;
                margin-bottom: 1rem;
            }

            /* hide radios */
            .model-picker__radio {
                display: none;
            }

            /* tabs */
            .model-picker__tabs {
                display: flex;
                gap: 1rem;
                border-bottom: 1px solid #ddd;
                margin-bottom: 1rem;
            }

            .model-picker__tab {
                cursor: pointer;
                padding: 0.5rem;
            }

            /* panels */
            .model-picker__panel {
                display: none;
            }

            .model-picker__heading {
                margin-top: 0;
            }

            .model-picker__description {
                font-size: 0.9rem;
                margin-bottom: 1rem;
            }

            /* inputs */
            .model-picker__label {
                display: flex;
                flex-direction: column;
                margin-bottom: 1rem;
            }

            .model-picker__input {
                padding: 0.4rem;
                font-size: 1rem;
            }

            .model-picker__checkbox {
                margin-top: 0.5rem;
            }

            /* show active panel */
            #webllm:checked
                ~ .model-picker__tabs
                + .model-picker__panels
                .model-picker__panel:nth-child(1),
            #ollama:checked
                ~ .model-picker__tabs
                + .model-picker__panels
                .model-picker__panel:nth-child(2),
            #remote:checked
                ~ .model-picker__tabs
                + .model-picker__panels
                .model-picker__panel:nth-child(3) {
                display: block;
            }

            /* active tab */
            #webllm:checked ~ .model-picker__tabs label[for="webllm"],
            #ollama:checked ~ .model-picker__tabs label[for="ollama"],
            #remote:checked ~ .model-picker__tabs label[for="remote"] {
                border-bottom: 2px solid black;
            }

            /* responsive */
            @media (max-width: 480px) {
                .model-picker__tabs {
                    flex-direction: column;
                }
            }

            .sidebar--threads {
                border: 2px solid;
            }

            main {
                border: 2px solid;
            }

            .model-picker {
                border: 2px solid;
            }
        </style>
    </head>

    <body>
        <aside class="sidebar sidebar--threads" data-state="open">
            <header class="sidebar--threads__header">
                <h2 class="sidebar--threads__title">Threads</h2>

                <button
                    type="button"
                    aria-label="Start new chat"
                    data-action="new-thread"
                >
                    +
                </button>

                <form role="search" data-action="search-threads">
                    <label for="thread-search-input">Search threads</label>
                    <input
                        id="thread-search-input"
                        type="search"
                        data-action="search-threads"
                    />
                </form>
            </header>

            <nav class="sidebar--threads__nav" aria-label="Thread list">
                <ul class="thread-list">
                    <!-- thread items go here -->
                    <!-- example:
                    <li class="thread-list__item" data-thread-id="123"></li>
                    -->
                </ul>
            </nav>
        </aside>

        <main class="main">
            <h1 class="main__title">
                From the sidebar, click + or select a previous chat
            </h1>
        </main>

        <form class="model-picker">
            <fieldset>
                <legend>Choose model source</legend>

                <!-- provider selector (still allowed) -->
                <nav class="tabs">
                    <label
                        ><input
                            type="radio"
                            name="provider"
                            value="webllm"
                            checked
                        />
                        WebLLM</label
                    >
                    <label
                        ><input type="radio" name="provider" value="ollama" />
                        Ollama</label
                    >
                    <label
                        ><input type="radio" name="provider" value="remote" />
                        Remote</label
                    >
                </nav>

                <!-- dynamic content -->
                <section id="panel"></section>

                <pre id="preview"></pre>

                <button type="submit">Submit</button>
            </fieldset>
        </form>
    </body>
</html>
