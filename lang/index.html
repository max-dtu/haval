<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>WebLLM Chat</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
				background: #f5f5f5;
				height: 100vh;
				display: flex;
				flex-direction: column;
			}

			.header {
				background: white;
				border-bottom: 1px solid #e5e5e5;
				padding: 1rem;
				display: flex;
				gap: 1rem;
				align-items: center;
				flex-wrap: wrap;
			}

			.header h1 {
				font-size: 1.25rem;
				flex: 1;
			}

			.model-section {
				display: flex;
				gap: 0.5rem;
				align-items: center;
			}

			select {
				padding: 0.5rem;
				border: 1px solid #d5d5d5;
				border-radius: 4px;
				font-size: 1rem;
				background: white;
			}

			button {
				padding: 0.5rem 1rem;
				background: #007acc;
				color: white;
				border: none;
				border-radius: 4px;
				cursor: pointer;
				font-size: 1rem;
				transition: background 0.2s;
			}

			button:hover:not(:disabled) {
				background: #005a9e;
			}

			button:disabled {
				background: #ccc;
				cursor: not-allowed;
			}

			.status {
				font-size: 0.9rem;
				color: #666;
				padding: 0.5rem 1rem;
				background: #f9f9f9;
				border-radius: 4px;
				min-width: 200px;
			}

			.chat {
				flex: 1;
				display: flex;
				flex-direction: column;
				overflow: hidden;
			}

			.messages {
				flex: 1;
				overflow-y: auto;
				padding: 1rem;
				display: flex;
				flex-direction: column;
				gap: 0.75rem;
			}

			.message {
				display: flex;
				gap: 0.75rem;
				animation: fadeIn 0.2s ease-in;
			}

			@keyframes fadeIn {
				from {
					opacity: 0;
					transform: translateY(8px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			.message.user {
				justify-content: flex-end;
			}

			.message-bubble {
				max-width: 70%;
				padding: 0.75rem 1rem;
				border-radius: 8px;
				word-wrap: break-word;
				white-space: pre-wrap;
				line-height: 1.5;
			}

			.message.assistant .message-bubble {
				background: #e8e8e8;
				color: #333;
			}

			.message.user .message-bubble {
				background: #007acc;
				color: white;
			}

			.composer {
				display: flex;
				gap: 0.5rem;
				padding: 1rem;
				background: white;
				border-top: 1px solid #e5e5e5;
			}

			textarea {
				flex: 1;
				padding: 0.75rem;
				border: 1px solid #d5d5d5;
				border-radius: 4px;
				font-family: inherit;
				font-size: 1rem;
				resize: none;
				max-height: 100px;
			}

			textarea:focus {
				outline: none;
				border-color: #007acc;
			}

			.loading {
				text-align: center;
				padding: 2rem;
				color: #666;
			}

			.progress-bar {
				width: 100%;
				height: 3px;
				background: #e5e5e5;
				margin-top: 0.5rem;
				border-radius: 2px;
				overflow: hidden;
			}

			.progress-fill {
				height: 100%;
				background: #007acc;
				transition: width 0.3s ease;
			}

			.error {
				background: #fee;
				color: #c33;
				padding: 0.75rem;
				border-radius: 4px;
				margin: 0.5rem;
				display: none;
			}

			.error.show {
				display: block;
			}

			.empty {
				flex: 1;
				display: flex;
				align-items: center;
				justify-content: center;
				color: #999;
				font-size: 1.1rem;
			}
		</style>
		<script type="module" src="./chat.js" defer></script>
	</head>
	<body>
		<header class="header">
			<h1>Chat</h1>
			<div class="model-section">
				<select data-action="model-select">
					<option value="Llama-3-8B-Instruct-q4f32_1">Llama 3 8B (default)</option>
					<option value="Mistral-7B-Instruct-v0.1-q4f32_1">Mistral 7B</option>
					<option value="NeuralHermes-2.5-Mistral-7B-q4f32_1">NeuralHermes 2.5</option>
					<option value="OpenHermes-2-Mistral-7B-q4f32_1">OpenHermes 2</option>
					<option value="phi-2-q4f32_1">Phi 2</option>
				</select>
				<button data-action="load-model">Load Model</button>
				<div class="status" data-role="status">Ready</div>
				<div data-role="progress" style="display: none; width: 200px">
					<div data-role="progress-text" style="font-size: 0.85rem; color: #666"></div>
					<div class="progress-bar">
						<div class="progress-fill" data-role="progress-fill"></div>
					</div>
				</div>
			</div>
		</header>

		<div class="error" data-role="error"></div>

		<div data-role="loading-screen" class="loading" style="display: none">
			<p>Select a model and click "Load Model" to start chatting.</p>
		</div>

		<div class="chat" data-role="chat" style="display: none">
			<div class="messages" data-role="messages"></div>
			<form class="composer" data-action="send-message">
				<textarea data-action="input" placeholder="Type a message..." rows="1"></textarea>
				<button type="submit">Send</button>
			</form>
		</div>
	</body>
</html>
