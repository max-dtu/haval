<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talk to Models</title>
    <link rel="stylesheet" href="./threads.css" />
    <script type="module" src="./threads.js" defer></script>
</head>

<body>
    <div class="layout">
        <aside class="sidebar sidebar--threads" data-state="open">
            <header class="sidebar--threads__header">
                <div class="sidebar--threads__title-row">
                    <h1 class="sidebar--threads__title">Threads</h1>
                    <button
                        type="button"
                        class="sidebar--threads__new"
                        aria-label="Start new chat"
                        data-action="new-thread"
                    >
                        +
                    </button>
                </div>

                <form class="sidebar--threads__search" role="search" data-action="search-threads">
                    <label class="visually-hidden" for="thread-search-input">Search threads</label>
                    <input
                        id="thread-search-input"
                        type="search"
                        data-role="thread-search-input"
                        placeholder="Search by title or latest message"
                    />
                </form>
            </header>

            <nav class="sidebar--threads__nav" aria-label="Thread list">
                <ul class="thread-list" data-role="thread-list">
                    <!-- thread items are rendered in threads.js -->
                </ul>
                <p class="thread-list__empty" data-role="thread-list-empty">
                    No threads yet. Click + to start.
                </p>
            </nav>
        </aside>

        <main class="main">
            <section class="empty-state" data-role="empty-state">
                <h2 class="empty-state__title">Start a conversation</h2>
                <p class="empty-state__copy">
                    Create a new thread from the sidebar, choose a model, and type your first message.
                </p>
            </section>

            <section class="thread-stage" data-role="thread-stage" aria-live="polite"></section>
        </main>
    </div>

    <template id="thread">
        <article class="thread-panel" data-state="expanded">
            <header class="thread-panel__header">
                <div>
                    <h2 class="thread-panel__title" data-role="thread-title">Untitled Thread</h2>
                    <time class="thread-panel__timestamp" data-role="thread-timestamp" datetime=""></time>
                </div>

                <div class="thread-panel__config">
                    <label class="thread-panel__model-field">
                        <span>Model</span>
                        <select name="model" data-action="select-model"></select>
                    </label>

                    <a class="thread-panel__link" href="../llm-config-platform/index.html">
                        Open LLM Config Platform
                    </a>

                    <button type="button" aria-label="Minimize chat" data-action="minimize-thread">
                        -
                    </button>
                </div>
            </header>

            <ol class="message-list" data-role="message-list"></ol>

            <form class="composer" data-action="send-message">
                <label class="visually-hidden" for="thread-message-input">Type your message</label>
                <input
                    id="thread-message-input"
                    type="text"
                    placeholder="Type your message here..."
                    data-role="composer-input"
                    autocomplete="off"
                />
                <button type="submit">Send</button>
            </form>
        </article>
    </template>
</body>

</html>
